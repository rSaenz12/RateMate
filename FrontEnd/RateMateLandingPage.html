<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RateMate</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body class="background">
var light_or_dark_path = "resources/StoreFrontsGPT.png";


<!--<img src="resources/StoreFrontsGptNight.png" alt="StoreFronts"-->
<!--     style="position: fixed; top: 50px; left: 0; width: 100%; height: 100vh; object-fit: cover; z-index: -1;">-->
<img id="backgroundImage" src="resources/StoreFrontsGPT.png" alt="StoreFronts"
     style="position: fixed; top: 50px; left: 0; width: 100%; height: 100vh; object-fit: cover; z-index: -1;">
<script>
    const img = document.getElementById('backgroundImage');
    const darkMode = window.matchMedia('(prefers-color-scheme: dark)');

    // Set initial image based on user preference
    function updateBackground(e) {
        if (e.matches) {
            img.src = "resources/StoreFrontsGptNight.png";
        } else {
            img.src = "resources/StoreFrontsGPT.png";
        }
    }

    // Listen for changes in color scheme
    darkMode.addEventListener('change', updateBackground);

    // Run once on load
    updateBackground(darkMode);
</script>

<div class="navigationBar">
    <!--    <p class="navBarLogo">RateMate</p>-->
    <img src="resources/RateMateLogo.JPG" alt="RateMate Logo" class="navBarLogo">

    <!--    This one is "empty" so that the filter is reset-->
    <a href="RateMateLandingPage.html">
        <button onclick="sessionStorage.setItem('sortByCondition', 'empty')" type="button" class="navButton">Search
        </button>
    </a>

    <!--sorts by distance    -->
    <a href="RateMateResultsPage.html">
        <button id="nearBy" onclick="sessionStorage.setItem('sortByCondition', 'distance')" type="button"
                class="navButton">Near By
        </button>
    </a>

    <!--    sorts by rating-->
    <a href="RateMateResultsPage.html">
        <button id="highestRated" onclick="sessionStorage.setItem('sortByCondition', 'rating')" type="button"
                class="navButton">Highest Rated
        </button>
    </a>

</div>


<div class="container">
    <h1 class="title">Welcome to RateMate</h1>
    <div class="searchBar">
        <input id="searchInput" type="search" placeholder="Search.."/>
        <a href="RateMateResultsPage.html">
            <!--            grabbing the input and commiting it to the session storage-->
            <script>const searchInput = document.getElementById('searchInput');</script>
            <button onclick="sessionStorage.setItem('userInput',searchInput.value )" type="submit" class="searchButton">
                Search
            </button>
        </a>

    </div>
</div>
</body>
</html>
